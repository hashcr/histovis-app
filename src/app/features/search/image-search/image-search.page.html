<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Image Search</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Search Images</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-searchbar placeholder="Search images..." (ionInput)="onSearch($event)"></ion-searchbar>

  <ion-grid>
    <ion-row>
      @for (img of filteredImages(); track img.id) {
        <ion-col size="6" size-md="4" size-lg="3">
          <app-image-card [image]="img"></app-image-card>
        </ion-col>
      }
    </ion-row>
  </ion-grid>
</ion-content>

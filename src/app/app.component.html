<ion-app>
  <ion-split-pane contentId="main-content" class="app-split-pane">
    <ion-menu contentId="main-content" type="overlay" class="app-nav-menu">
      <ion-content>
        <ion-list id="inbox-list">
          <ion-list-header>
            <ion-chip>
              <ion-avatar>
                <img alt="Silhouette of a person's head" src="https://ionicframework.com/docs/img/demos/avatar.svg" />
              </ion-avatar>
              <ion-label>{{ loggedUser()?.firstName ?? 'Guest' }}</ion-label>
            </ion-chip>
          </ion-list-header>

          @for (p of appPages; track p; let i = $index) {
          <ion-menu-toggle auto-hide="false">
            <ion-item routerDirection="root" [routerLink]="[p.url]" lines="none" detail="false"
              routerLinkActive="selected">
              <ion-icon aria-hidden="true" slot="start" [ios]="p.icon + '-outline'" [md]="p.icon + '-sharp'"></ion-icon>
              <ion-label>{{ p.title }}</ion-label>
            </ion-item>
          </ion-menu-toggle>
          }

          @if(loggedUser()?.isAdmin) {
          <ion-menu-toggle auto-hide="false">
            <ion-item routerDirection="root" [routerLink]="['/admin']" lines="none" detail="false"
              routerLinkActive="selected">
              <ion-icon aria-hidden="true" slot="start" [ios]="'settings-outline'" [md]="'settings-sharp'"></ion-icon>
              <ion-label>Admin</ion-label>
            </ion-item>
          </ion-menu-toggle>
          }

          <ion-menu-toggle auto-hide="false">
            <ion-item routerDirection="root" [routerLink]="['/about']" lines="none" detail="false"
              routerLinkActive="selected">
              <ion-icon aria-hidden="true" slot="start" [ios]="'information-circle-outline'"
                [md]="'information-circle-sharp'"></ion-icon>
              <ion-label>About</ion-label>
            </ion-item>
          </ion-menu-toggle>

          @if(loggedUser()) {
          <ion-menu-toggle auto-hide="false">
            <ion-item routerDirection="root" [routerLink]="['/logout']" lines="none" detail="false"
              routerLinkActive="selected">
              <ion-icon aria-hidden="true" slot="start" [ios]="'log-out-outline'" [md]="'log-out-sharp'"></ion-icon>
              <ion-label>Logout</ion-label>
            </ion-item>
          </ion-menu-toggle>
          }
        </ion-list>
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
